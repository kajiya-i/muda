name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'flake.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: nix develop .. --command bun install --frozen-lockfile

      - name: Typecheck
        run: nix develop .. --command bun run typecheck

      - name: Lint and format
        run: nix develop .. --command bun run check

      - name: Test
        run: nix develop .. --command bun run test

      - name: Build
        run: nix develop .. --command bun run build