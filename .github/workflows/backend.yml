name: Backend

on:
  pull_request:
    paths:
      - "api/**"
      - "backend/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "backend/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: muda
          POSTGRES_PASSWORD: muda
          POSTGRES_DB: muda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muda -d muda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://muda:muda@localhost:5432/muda?sslmode=disable
      GOOSE_MIGRATION_DIR: db/migrations

    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.sum', 'flake.lock') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Build
        run: nix develop .. --command go build ./...

      - name: Test
        run: nix develop .. --command go test -race ./...

      - name: Lint
        run: nix develop .. --command golangci-lint run ./...

      - name: Check generated code
        run: |
          nix develop .. --command go tool sqlc diff
          nix develop .. --command go tool oapi-codegen -config oapi-codegen.yaml ../api/openapi.yaml
          git diff --exit-code

      - name: Migrate up, down and up again
        run: |
          nix develop .. --command go tool goose up
          nix develop .. --command go tool goose reset
          nix develop .. --command go tool goose up