version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gochecksumtype
    - gosec
  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - github.com/kajiya-i/muda/backend/internal/domain
          deny:
            - pkg: database/sql
              desc: ドメイン層はデータベースにアクセスしない
            - pkg: net/http
              desc: ドメイン層は HTTP に依存しない
            - pkg: os
              desc: ドメイン層は環境変数などを読まない
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: 現在時刻は引数で受け取る（docs/rules/backend.md §2）
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: 設定は起動時に 1 か所で読み込む（docs/rules/backend.md §2）
  exclusions:
    rules:
      # テストでは、再現できるように種を固定した乱数を使うため、gosec の G404 を除外する
      - path: _test\.go
        linters:
          - gosec
        text: G404

formatters:
  enable:
    - gofmt
    - goimports